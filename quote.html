<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Catering Proposal — Malay Fast Foods</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/crm.css">
</head>
<body class="portal">
  <div class="portal-main">
    <div class="portal-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="brand-let">M</div>
        <div><b style="font-family:var(--serif);font-size:1.15rem;letter-spacing:.04em">MALAY FAST FOODS</b><br>
        <span class="cap">Catering Proposal</span></div>
      </div>
      <a class="btn-ghost" href="index.html#catering">← Back to website</a>
    </div>

    <div id="portalContent"><p class="muted" style="padding:40px 0;text-align:center">Loading your proposal…</p></div>
  </div>

<script src="js/crm-data.js"></script>
<script>
(function () {
  if (!window.CRM) { document.addEventListener('crm-ready', boot); } else boot();
  function boot() {
    var CRM = window.CRM;
    var ref = new URLSearchParams(location.search).get('ref');
    var host = document.getElementById('portalContent');
    var db = CRM.loadDB();
    var r = CRM.findRequest(ref);
    if (!r) {
      host.innerHTML = '<div class="quote-sheet"><span class="cap">Not found</span><h2>We could not find this request.</h2>' +
        '<p class="muted">Check the reference in your confirmation — or start a new one from the website.</p>' +
        '<div class="portal-actions"><a class="btn" href="index.html#catering">Request a quote</a></div></div>';
      return;
    }
    var cust = CRM.findCustomer(r.customer_id);
    var q = CRM.findQuoteByRequest(r.request_id);
    var esc = function (s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };
    var fmt = function (d) { return String(d || '').slice(0, 10); };
    var money = CRM.money;

    var timeline = [
      { s: 'Request Received', done: true },
      { s: 'Requirements Reviewed', done: r.status !== 'New' },
      { s: 'Quote Prepared', done: !!q },
      { s: 'Quote Sent', done: !!q },
      { s: 'Awaiting Confirmation', now: !!q && q.status !== 'Accepted', done: !!q && q.status === 'Accepted' }
    ];

    var itemsRows = q ? q.items.map(function (i) {
      return '<tr><td data-l="Item">' + esc(i.name) + '<br><small class="muted">' + esc(i.brand) + '</small></td>' +
        '<td data-l="Qty" class="ta-r">' + i.qty + '</td>' +
        '<td data-l="Rate" class="ta-r">' + money(i.unit) + '</td>' +
        '<td data-l="Total" class="ta-r"><b>' + money(i.qty * i.unit) + '</b></td></tr>';
    }).join('') : '';

    var html =
      '<div class="quote-sheet">' +
        '<div class="q-head"><span class="cap">CATERING PROPOSAL</span>' +
          '<div class="q-org"><b>MALAY FAST FOODS</b><span>115 Hill Street, Dehiwala 10350<br>+94 11 777 7999 · malayrestaurant.appigo.co</span></div>' +
        '</div><hr>' +
        '<h2 class="q-title">Your Catering Proposal</h2>' +
        '<p class="muted">Prepared for ' + esc(r.customer.name) + '. Please review the details below.</p>' +
        '<div class="q-meta">' +
          '<div><span>Reference</span><b class="mono">' + esc(r.request_id) + '</b></div>' +
          '<div><span>Quote</span><b class="mono">' + esc(q ? q.quote_id : 'Being prepared') + '</b></div>' +
          '<div><span>Event</span><b>' + esc(r.event_type) + '</b></div>' +
          '<div><span>Date</span><b class="mono">' + fmt(r.event_date) + '</b></div>' +
          '<div><span>Venue</span><b>' + esc(r.location) + '</b></div>' +
          '<div><span>Guests</span><b>' + r.guest_count + '</b></div>' +
          '<div><span>Concept</span><b>' + esc(CRM.brandName(r.preferred_brand)) + '</b></div>' +
          '<div><span>Service</span><b>' + esc(r.service_type) + '</b></div>' +
          '<div><span>Budget range</span><b>' + (r.budget ? money(r.budget) : 'Open') + '</b></div>' +
        '</div>' +
        (q ? '<table class="crm-table q-items"><thead><tr><th>Item</th><th class="ta-r">Qty</th><th class="ta-r">Rate</th><th class="ta-r">Total</th></tr></thead><tbody>' + itemsRows + '</tbody></table>' +
        '<div class="tot-row">' +
          '<div><span>Subtotal</span><b>' + money(q.subtotal) + '</b></div>' +
          '<div><span>Service charge</span><b>' + money(q.service_charge) + '</b></div>' +
          '<div><span>Delivery</span><b>' + money(q.delivery) + '</b></div>' +
          (q.discount ? '<div><span>Discount</span><b>− ' + money(q.discount) + '</b></div>' : '') +
          (q.tax ? '<div><span>Tax</span><b>' + money(q.tax) + '</b></div>' : '') +
          '<div class="grand"><span>Total (incl. GST where applicable)</span><b>' + money(q.total) + '</b></div>' +
        '</div>' +
        '<p class="muted small">' + esc(q.notes || '') + '</p>' +
        '<div class="portal-actions">' +
          (q.status === 'Accepted'
            ? '<span class="st st-accepted" style="padding:10px 18px;font-size:.8rem">This proposal has been accepted. Our team will be in touch to confirm final details.</span>'
            : '<button class="btn" id="acceptBtn">Accept proposal</button> <button class="btn-ghost" id="changesBtn">Request changes</button>') +
        '</div>' : '<p class="muted" style="padding:14px 0">Our team is preparing your proposal. A quote will appear here and will be shared with you when ready.</p>') +
        '<div class="q-status"><h3>Status</h3><div class="pipe-vert">' +
          timeline.map(function (t) {
            return '<div class="pv ' + (t.done ? 'done' : t.now ? 'now' : '') + '"><i></i><span>' + t.s + '</span></div>';
          }).join('') +
        '</div></div>' +
        '<p class="muted small" style="margin-top:22px">Questions? Call <a href="tel:+94117777999">+94 11 777 7999</a> or email <a href="mailto:catering@malayfastfoods.lk">catering@malayfastfoods.lk</a>.</p>' +
      '</div>';

    host.innerHTML = html;

    var accept = document.getElementById('acceptBtn');
    if (accept) accept.addEventListener('click', function () {
      if (!q) return;
      q.status = 'Accepted';
      if (CRM.STATUSES.indexOf(r.status) < CRM.STATUSES.indexOf('Confirmed')) r.status = 'Confirmed';
      CRM.save(db);
      location.reload();
    });
    var changes = document.getElementById('changesBtn');
    if (changes) changes.addEventListener('click', function () {
      if (!q) return;
      q.status = 'Changes Requested';
      CRM.save(db);
      alert('Thanks — our team will review your requested changes and follow up shortly.');
      location.reload();
    });
  }
})();
</script>
</body>
</html>
