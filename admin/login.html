<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — Sign In | Malay Fast Foods</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127859;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --gold: #C9A86A; --gold2: #E9CF96; --iv: #F5F0E6;
    --bg: #14100B; --panel: rgba(28, 23, 16, 0.82); --ink: #F4EBDD; --mut: #A99B84; --line: rgba(201, 168, 106, 0.22); --red: #D2896B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Cormorant Garamond", "Times New Roman", serif; color: var(--ink);
    background:
      radial-gradient(1000px 520px at 18% -6%, rgba(201, 168, 106, 0.22), transparent 60%),
      radial-gradient(800px 560px at 92% 112%, rgba(201, 168, 106, 0.14), transparent 58%),
      linear-gradient(180deg, #1A140C, #0E0B07);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.4;
    background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 4px 4px;
  }
  .wrap { position: relative; width: 100%; max-width: 430px; text-align: center; }
  .brand { font-size: 20px; letter-spacing: 0.1em; margin-bottom: 4px; }
  .brand span { color: var(--mut); font-size: 11px; letter-spacing: 0.4em; display: block; margin-top: 6px; }
  .card {
    margin-top: 34px; background: var(--panel); border: 1px solid var(--line);
    padding: 44px 38px 40px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  h1 { font-size: 28px; font-weight: 500; color: var(--iv); }
  .sub { margin-top: 8px; font-family: "Jost", sans-serif; font-size: 12px; letter-spacing: 0.24em; color: var(--mut); text-transform: uppercase; }
  .field { text-align: left; margin-top: 26px; }
  .field label { font-family: "Jost", sans-serif; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mut); display: block; margin-bottom: 9px; }
  .field input {
    width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: var(--ink);
    padding: 14px 15px; font-family: "Jost", sans-serif; font-size: 15px; outline: none; transition: border-color 0.25s;
  }
  .field input:focus { border-color: var(--gold); }
  button {
    margin-top: 30px; width: 100%; background: var(--gold); color: #16110A; border: 0; cursor: pointer;
    padding: 16px; font-family: "Jost", sans-serif; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase;
    transition: background 0.3s;
  }
  button:hover { background: var(--gold2); }
  .err { margin-top: 16px; min-height: 18px; font-family: "Jost", sans-serif; font-size: 13px; color: var(--red); letter-spacing: 0.04em; }
  .divider { margin: 28px 0 0; border-top: 1px solid var(--line); padding-top: 20px; font-family: "Jost", sans-serif; font-size: 12px; letter-spacing: 0.2em; color: var(--mut); }
  a { color: var(--gold2); text-decoration: none; }
  .foot { margin-top: 22px; font-family: "Jost", sans-serif; font-size: 12px; letter-spacing: 0.16em; color: var(--mut); }
  .back { margin-top: 18px; display: inline-block; font-family: "Jost", sans-serif; font-size: 12px; letter-spacing: 0.24em; color: var(--mut); }
  .back:hover { color: var(--gold2); }
</style>
<script src="/js/crm-data.js"></script>
<script>
  (function () {
    function submit(e) {
      e.preventDefault();
      var u = document.getElementById('u').value;
      var p = document.getElementById('p').value;
      var err = document.getElementById('err');
      if (!CRM.login(u, p)) {
        err.textContent = 'Incorrect username or password.';
        return;
      }
      err.textContent = '';
      location.href = 'dashboard.html';
    }
    window.addEventListener('DOMContentLoaded', function () {
      if (CRM.isAuthed()) { location.replace('dashboard.html'); return; }
      document.getElementById('f').addEventListener('submit', submit);
    });
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="brand">MALAY FAST FOODS</div>
    <div class="brand" style="font-size:12px;color:#A99B84;letter-spacing:0.3em;">STAFF PORTAL · CRM</div>
    <div class="card">
      <h1>Sign In</h1>
      <p class="sub">Internal catering &amp; client workspace</p>
      <form id="f" novalidate>
        <div class="field">
          <label for="u">Username</label>
          <input id="u" name="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input id="p" name="p" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign In</button>
        <div class="err" id="err" role="alert"></div>
      </form>
      <div class="divider"><a href="/">← Back to the Website</a></div>
    </div>
    <div class="foot">Restricted access · For catering &amp; client staff</div>
  </div>
</body>
</html>
